<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOW SHINE YOUR AURA - OFFICIAL</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap');
*{font-family:'Outfit',sans-serif}
body{background:#080510}
.bg-aura{background:radial-gradient(circle at 50% 20%,#a855f7 0%,#6d28d9 15%,#1a0a2e 40%,#080510 75%)}
.glass{backdrop-filter:blur(20px);background:rgba(255,255,255,0.06);border:1px solid rgba(168,85,247,0.25);box-shadow:0 0 30px rgba(168,85,247,0.15)}
.gold{border:2px solid #c084fc;box-shadow:0 0 25px rgba(168,85,247,0.4)}
</style>
</head>
<body class="min-h-screen text-white">
<script>
let USERS=JSON.parse(localStorage.getItem('nsya_users')||'[]');
let ADMIN={email:'anup97005@admin.com',pass:'facedevilff1225',name:'ANUP 999+',aura:999999,photo:'',role:'admin'};
let CUR=JSON.parse(localStorage.getItem('nsya_cur')||'null');
let LEVELS=[
{id:1,min:0,max:9,s:'STYLE 01 • DORMANT',t:'Dormant',need:0},
{id:2,min:10,max:19,s:'STYLE 02 • AWAKENING',t:'Awakening',need:1000},
{id:3,min:20,max:29,s:'STYLE 03 • RADIANT',t:'Radiant',need:3000},
{id:4,min:30,max:39,s:'STYLE 04 • LUMINOUS',t:'Luminous',need:6000},
{id:5,min:40,max:49,s:'STYLE 05 • ETHEREAL',t:'Ethereal',need:10000},
{id:6,min:50,max:59,s:'STYLE 06 • AURA',t:'Aura',need:20000},
{id:7,min:60,max:69,s:'STYLE 07 • CELESTIAL',t:'Celestial',need:40000},
{id:8,min:70,max:79,s:'STYLE 08 • DIVINE',t:'Divine',need:80000},
{id:9,min:80,max:89,s:'STYLE 09 • LEGENDARY',t:'Legendary',need:150000},
{id:10,min:90,max:999,s:'STYLE 10 • MYTHIC',t:'Mythic',need:200000}
];
let TASKS=JSON.parse(localStorage.getItem('nsya_tasks')||JSON.stringify([
{id:1,title:'Morning Meditation',aura:50,desc:'10 min focus'},
{id:2,title:'Share Positivity',aura:100,desc:'Post your aura'},
{id:3,title:'Complete Profile Photo',aura:200,desc:'Add real photo'},
{id:4,title:'Invite Friend',aura:300,desc:'Grow circle'},
{id:5,title:'Daily Check-in',aura:75,desc:'Open daily'}
]));
function getLvl(a){let c=LEVELS[0];for(let l of LEVELS){if(a>=l.need)c=l}return c}
function save(){localStorage.setItem('nsya_users',JSON.stringify(USERS));localStorage.setItem('nsya_tasks',JSON.stringify(TASKS));if(CUR)localStorage.setItem('nsya_cur',JSON.stringify(CUR));render()}
let page='home',tab='user';
function render(){
let app=document.getElementById('app');
if(!CUR){
app.innerHTML=`
<div class="min-h-screen flex items-center justify-center p-4 bg-aura relative overflow-hidden">
<div class="absolute top-[5%] left-1/2 -translate-x-1/2 w-[600px] h-[600px] bg-purple-500/30 rounded-full blur-[100px]"></div>
<div class="absolute top-[15%] left-1/2 -translate-x-1/2 opacity-30 text-[200px]">👤</div>
<div class="relative z-10 w-full max-w-[380px]">
<div class="glass rounded-[1.6rem] p-7">
<div class="flex items-center gap-2 justify-center">
<span class="text-purple-400 text-xl">✦</span>
<h1 class="text-[20px] font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-purple-200 to-purple-400">NOWSHINEYOURAURA</h1>
</div>
<p class="text-center text-[12px] text-purple-200/60 mt-1">Welcome Back • Sign in to continue</p>
<div class="flex gap-1 mt-5 p-1 rounded-full bg-white/10">
<button onclick="tab='user';render()" class="flex-1 py-2 rounded-full ${tab=='user'?'bg-white text-black font-bold':''} text-[12px]">User Login</button>
<button onclick="tab='admin';render()" class="flex-1 py-2 rounded-full ${tab=='admin'?'bg-white text-black font-bold':''} text-[12px]">Admin Login</button>
</div>
<input id="n" placeholder="Full Name" class="w-full mt-4 px-4 py-3.5 rounded-xl bg-white/5 border border-purple-400/20 outline-none text-sm ${tab=='admin'?'hidden':''}">
<div class="mt-3 relative">
<span class="absolute left-3 top-1/2 -translate-y-1/2 text-white/30 text-sm"><i class="fa-regular fa-envelope"></i></span>
<input id="e" placeholder="Email" class="w-full pl-10 pr-4 py-3.5 rounded-xl bg-white/5 border border-purple-400/20 outline-none text-sm placeholder:text-white/30">
</div>
<div class="mt-3 relative">
<span class="absolute left-3 top-1/2 -translate-y-1/2 text-white/30 text-sm"><i class="fa-solid fa-lock"></i></span>
<input id="p" type="password" placeholder="Password" class="w-full pl-10 pr-4 py-3.5 rounded-xl bg-white/5 border border-purple-400/20 outline-none text-sm placeholder:text-white/30">
</div>
<input id="ph" type="file" accept="image/*" class="w-full mt-3 text-[11px] text-white/40 ${tab=='admin'?'hidden':''}">
<button onclick="login()" class="w-full mt-5 py-3.5 rounded-xl bg-gradient-to-r from-violet-600 to-purple-600 font-black text-sm shadow-[0_0_20px_rgba(168,85,247,0.5)]">ENTER AURA →</button>
<p class="text-center text-[11px] text-white/40 mt-4">AURA GOD • ANUP 999+ • MYTHIC ADMIN</p>
</div>
</div>
</div>`;return
}
let lvl=getLvl(CUR.aura||0);
let isAdmin=CUR.role=='admin';
if(isAdmin){
app.innerHTML=`
<div class="p-4 max-w-6xl mx-auto">
<div class="glass rounded-[1.5rem] p-5 flex justify-between items-center">
<h2 class="text-xl font-black">ADMIN DASHBOARD 👑 <span class="text-purple-400 text-xs">ANUP 999+</span></h2>
<button onclick="logout()" class="px-4 py-2 rounded-full bg-red-500/20 text-red-400 text-xs">Logout</button>
</div>
<div class="grid grid-cols-3 gap-3 mt-5">
<div class="glass rounded-2xl p-4 text-center"><h3 class="text-2xl font-black">${USERS.length}</h3><p class="text-[10px] opacity-60">Total Users</p></div>
<div class="glass rounded-2xl p-4 text-center"><h3 class="text-2xl font-black text-purple-400">${USERS.reduce((s,u)=>s+(u.aura||0),0)}</h3><p class="text-[10px] opacity-60">Total Aura</p></div>
<div class="glass rounded-2xl p-4 text-center"><h3 class="text-2xl font-black">${TASKS.length}</h3><p class="text-[10px] opacity-60">Tasks</p></div>
</div>
<div class="grid md:grid-cols-2 gap-4 mt-5">
<div class="glass rounded-2xl p-5">
<h3 class="font-bold text-sm mb-3">Give Aura</h3>
<input id="giveEmail" placeholder="User Email" class="w-full p-3 rounded-xl bg-white/5 border border-white/10 text-sm">
<input id="giveAura" type="number" placeholder="Amount" class="w-full p-3 mt-2 rounded-xl bg-white/5 border border-white/10 text-sm">
<button onclick="giveAura()" class="w-full mt-3 py-3 rounded-xl bg-purple-600 font-black text-sm">Give Aura</button>
</div>
<div class="glass rounded-2xl p-5">
<h3 class="font-bold text-sm mb-3">Create Task</h3>
<input id="tTitle" placeholder="Task Title" class="w-full p-3 rounded-xl bg-white/5 border border-white/10 text-sm">
<input id="tAura" type="number" placeholder="Reward" class="w-full p-3 mt-2 rounded-xl bg-white/5 border border-white/10 text-sm">
<button onclick="addTask()" class="w-full mt-3 py-3 rounded-xl bg-white text-black font-black text-sm">Add Task</button>
</div>
</div>
<div class="mt-5 glass rounded-2xl p-5">
<h3 class="font-bold text-sm">All Users</h3>
<div class="mt-3 space-y-2">${USERS.map(u=>`<div class="flex justify-between items-center p-3 rounded-xl bg-white/5"><div><p class="font-bold text-sm">${u.name} ${u.banned?'<span class=text-red-400>[BANNED]</span>':''}</p><p class="text-[11px] opacity-60">${u.email} • ${u.aura} AE • ${getLvl(u.aura).t}</p></div><div class="flex gap-2"><button onclick="banUser(${u.id})" class="px-3 py-1 rounded-full text-[10px] bg-red-500/20 text-red-400">${u.banned?'Unban':'Ban'}</button><button onclick="delUser(${u.id})" class="px-3 py-1 rounded-full text-[10px] bg-white/10">Del</button></div></div>`).join('')||'<p class=text-xs opacity-50>No users</p>'}</div>
</div>
</div>`;
}else{
app.innerHTML=`
<div class="p-4 max-w-5xl mx-auto">
<div class="glass rounded-[1.5rem] p-4 flex justify-between items-center">
<h2 class="font-black text-sm">NSYA • ${CUR.name}</h2>
<div class="flex gap-1.5">
<button onclick="page='home';render()" class="px-3 py-1.5 rounded-full ${page=='home'?'bg-white text-black':'bg-white/10'} text-[11px] font-bold">Home</button>
<button onclick="page='aura';render()" class="px-3 py-1.5 rounded-full ${page=='aura'?'bg-white text-black':'bg-white/10'} text-[11px] font-bold">Aura</button>
<button onclick="page='profile';render()" class="px-3 py-1.5 rounded-full ${page=='profile'?'bg-white text-black':'bg-white/10'} text-[11px] font-bold">Profile</button>
<button onclick="page='settings';render()" class="px-3 py-1.5 rounded-full bg-white/10 text-[11px]"><i class="fa-solid fa-gear"></i></button>
</div>
</div>
${page=='home'?`<div class="mt-5 grid md:grid-cols-2 gap-4"><div class="glass rounded-[1.8rem] p-7"><h1 class="text-5xl font-black">${CUR.aura||0}<span class="text-purple-400 text-xl"> AE</span></h1><p class="mt-2 opacity-70 text-sm">${lvl.s}</p><div class="mt-4 w-full h-2.5 rounded-full bg-white/10 overflow-hidden"><div class="h-full bg-gradient-to-r from-violet-500 to-purple-400" style="width:${Math.min(100,((CUR.aura-lvl.need)/( (LEVELS[LEVELS.findIndex(x=>x.id==lvl.id)+1]?.need||lvl.need+1)-lvl.need))*100)}%"></div></div><p class="text-[11px] mt-2 opacity-60">Level ${lvl.min}+ • Next: ${LEVELS[LEVELS.findIndex(x=>x.id==lvl.id)+1]?.need||'MAX'} AE</p></div><div class="space-y-2.5">${TASKS.map(t=>`<div class="glass rounded-2xl p-4 flex justify-between items-center"><div><p class="font-bold text-[13px]">${t.title}</p><p class="text-[11px] opacity-60">${t.desc} • +${t.aura} AE</p></div><button onclick="doTask(${t.id})" class="px-4 py-2 rounded-full bg-purple-600 text-white text-[11px] font-black">Do</button></div>`).join('')}</div></div>`:''}
${page=='aura'?`<div class="mt-5 glass rounded-[1.8rem] p-8 text-center"><h1 class="text-[64px] font-black text-purple-400 leading-none">${CUR.aura||0}</h1><p class="opacity-70 mt-2 text-sm">Aura Energy • Level ${lvl.min}+ ${lvl.t}</p><p class="text-[11px] mt-2 opacity-60">${lvl.s}</p></div>`:''}
${page=='profile'?`<div class="mt-5 glass rounded-[1.8rem] p-6 flex gap-5 items-center"><img src="${CUR.photo||'https://i.pravatar.cc/150'}" class="w-20 h-20 rounded-[1.2rem] object-cover border-2 border-purple-400"><div><h3 class="text-xl font-black">${CUR.name}</h3><p class="opacity-60 text-[12px]">${CUR.email} • ${CUR.aura} AE • Level ${lvl.min}+</p><input type="file" id="newPhoto" accept="image/*" class="mt-3 text-[11px]"></div></div><div class="mt-4 gold rounded-[1.8rem] p-6"><h3 class="font-black text-purple-300 text-sm">ANUP 999+ REFERENCE CARD</h3><p class="text-[12px] mt-2">Name: ANUP • Level: 999+ • Aura: Eternal Origin • Type: Mythic • Energy: Not Defined • Vibe: Aura God<br>Code: 0000 0000 9999 0001 • STYLE 10 • MYTHIC • ADMIN SPECIAL<br><i>"Beyond levels, I AM aura."</i></p></div>`:''}
${page=='settings'?`<div class="mt-5 glass rounded-2xl p-5 space-y-3"><h3 class="font-bold text-sm">Settings</h3><input id="setName" value="${CUR.name}" class="w-full p-3.5 rounded-xl bg-white/5 border border-white/10 text-sm"><input id="setEmail" value="${CUR.email}" class="w-full p-3.5 rounded-xl bg-white/5 border border-white/10 text-sm"><button onclick="CUR.name=document.getElementById('setName').value;CUR.email=document.getElementById('setEmail').value;let i=USERS.findIndex(x=>x.id==CUR.id);if(i>=0){USERS[i].name=CUR.name;USERS[i].email=CUR.email}save();alert('Saved')" class="w-full py-3 rounded-xl bg-purple-600 font-black text-sm">Save</button><button onclick="logout()" class="w-full py-3 rounded-xl bg-red-500/20 text-red-400 text-sm">Logout</button></div>`:''}
</div>`;
let np=document.getElementById('newPhoto');if(np)np.onchange=e=>{let f=e.target.files[0];let r=new FileReader();r.onload=ev=>{CUR.photo=ev.target.result;let idx=USERS.findIndex(x=>x.id==CUR.id);if(idx>=0)USERS[idx].photo=CUR.photo;save()};r.readAsDataURL(f)};
}
}
function giveAura(){let em=document.getElementById('giveEmail').value.trim();let am=parseInt(document.getElementById('giveAura').value);let u=USERS.find(x=>x.email==em);if(!u)return alert('User not found');u.aura=(u.aura||0)+am;save();alert('Aura Given')}
function addTask(){let t=document.getElementById('tTitle').value;let a=parseInt(document.getElementById('tAura').value);if(!t||!a)return;TASKS.push({id:Date.now(),title:t,aura:a,desc:'Custom'});save()}
function doTask(id){let t=TASKS.find(x=>x.id==id);if(!t)return;CUR.aura=(CUR.aura||0)+t.aura;let idx=USERS.findIndex(x=>x.id==CUR.id);if(idx>=0)USERS[idx].aura=CUR.aura;save();alert('+' + t.aura + ' Aura Added')}
function banUser(id){let u=USERS.find(x=>x.id==id);if(u){u.banned=!u.banned;save()}}
function delUser(id){if(confirm('Delete?')){USERS=USERS.filter(x=>x.id!=id);save()}}
function login(){
let n=document.getElementById('n')?.value||'',e=document.getElementById('e').value.trim(),p=document.getElementById('p').value.trim();
if(tab=='admin'){if(e==ADMIN.email&&p==ADMIN.pass){CUR={role:'admin',...ADMIN};save()}else alert('Wrong Admin! anup97005@admin.com / facedevilff1225');return}
let f=document.getElementById('ph')?.files[0];
let go=(ph='')=>{let u=USERS.find(x=>x.email==e);if(u){if(u.banned){alert('BANNED');return}if(u.pass!=p){alert('Wrong password');return}CUR={role:'user',...u};save()}else{if(!n||!e||!p){alert('Fill Name Email Pass');return}let nu={id:Date.now(),name:n,email:e,pass:p,aura:100,photo:ph,banned:false};USERS.push(nu);CUR={role:'user',...nu};save()}};
if(f){let r=new FileReader();r.onload=ev=>go(ev.target.result);r.readAsDataURL(f)}else go('');
}
function logout(){CUR=null;localStorage.removeItem('nsya_cur');render()}
render();
</script>
<div id="app"></div>
</body>
</html>
