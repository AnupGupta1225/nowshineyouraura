<!DOCTYPE html>

<head>

<title>NOWSHINEYOURAURA</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{font-family:'Outfit',sans-serif; -webkit-tap-highlight-color: transparent;}
body{margin:0;background:#0a0218;overflow-x:hidden;}
.bg-main{
background:
radial-gradient(ellipse at 50% 0%, #b368ff 0%, #7c2cf0 22%, #1a0a2e 55%, #0a0218 85%),
url('https://images.unsplash.com/photo-1534796636912-3b95b3ab5986?q=80&w=1000');
background-blend-mode: screen, normal;
background-size: cover;
background-position: top center;
min-height:100vh;
position:relative;
}
.bg-main::before{
content:'';position:absolute;inset:0;
background: radial-gradient(ellipse at 50% 15%, rgba(168,85,247,0.6) 0%, rgba(0,0,0,0.8) 70%);
}
.aura-glow{
position:absolute; top:5%; left:50%; transform:translateX(-50%);
width:380px; height:500px;
background: radial-gradient(ellipse at center, #fff 0%, #d8b4fe 10%, #a855f7 25%, transparent 65%);
filter: blur(2px);
opacity:0.9;
}
.silhouette{
position:absolute; top:18%; left:50%; transform:translateX(-50%);
width:220px; height:320px;
background:#000;
clip-path: polygon(50% 0%, 62% 8%, 75% 5%, 85% 15%, 82% 30%, 88% 45%, 85% 100%, 15% 100%, 12% 45%, 18% 30%, 15% 15%, 25% 5%, 38% 8%);
box-shadow: 0 0 40px #a855f7, 0 0 80px #a855f7, 0 0 120px #d8b4fe;
}
.silhouette::after{
content:'';
position:absolute; top:35%; left:35%; width:30%; height:12%;
background:#a855f7;
filter: blur(8px);
border-radius:50%;
box-shadow: 0 0 20px #a855f7;
}
.glass{
background: linear-gradient(135deg, rgba(255,255,255,0.12), rgba(255,255,255,0.04));
backdrop-filter: blur(24px);
-webkit-backdrop-filter: blur(24px);
border: 1px solid rgba(192,132,252,0.3);
box-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.15), 0 0 30px rgba(168,85,247,0.2);
}
.glass-input{
background: rgba(255,255,255,0.06);
border: 1px solid rgba(192,132,252,0.35);
backdrop-filter: blur(10px);
}
.btn-purple{
background: linear-gradient(135deg, #9b5cff, #6d28d9);
box-shadow: 0 4px 20px rgba(155,92,255,0.5), inset 0 1px 0 rgba(255,255,255,0.2);
}
.bottom-nav{
background: rgba(30,15,60,0.85);
backdrop-filter: blur(20px);
border: 1px solid rgba(168,85,247,0.3);
}
</style>
</head>
<body>
<div id="app"></div>
<script>

let TASKS = JSON.parse(localStorage.getItem('nsya_t2')||'[]');
let CUR = JSON.parse(localStorage.getItem('nsya_cur2')||'null');
let PAGE = CUR? 'welcome' : 'login';

function save(){
localStorage.setItem('nsya_u2',JSON.stringify(USERS));
localStorage.setItem('nsya_t2',JSON.stringify(TASKS));
if(CUR) localStorage.setItem('nsya_cur2',JSON.stringify(CUR));
render();
}

}

<button onclick="logout()" class="glass px-4 py-1.5 rounded-full text-white text-[12px] flex items-center gap-2"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>

<div class="glass rounded-[28px] p-8 text-center">
<div class="text-[32px]">✨</div>

<button onclick="PAGE='home';render()" class="btn-purple w-full mt-8 py-3.5 rounded-full text-white font-semibold">Continue to Aura Dashboard</button>
</div>
</div>
</div>`;
return;
}
let lvl = Math.floor((CUR.aura||0)/400)+1;
let xp = (CUR.aura||0)%400;
let pct = Math.floor((xp/400)*100);

if(PAGE=='home'){

</div>
