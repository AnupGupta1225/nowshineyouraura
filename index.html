<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Now Shine Your Aura - Official</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap');
*{font-family:'Outfit',sans-serif}
.glass{backdrop-filter:blur(16px);background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.1)}
.gold{border:2px solid #FFD700;box-shadow:0 0 20px rgba(255,215,0,0.3)}
</style>
</head>
<body class="bg-black text-white min-h-screen">
<script>
let USERS=JSON.parse(localStorage.getItem('nsya_users')||'[]');
let ADMIN=JSON.parse(localStorage.getItem('nsya_admin')||JSON.stringify({email:'anup97005@admin.com',pass:'facedevilff1225',name:'ANUP 999+',aura:999999,level:'999+ Mythic',photo:''}));
let CUR=JSON.parse(localStorage.getItem('nsya_cur')||'null');
let LEVELS=[
{id:1,min:0,max:9,s:'STYLE 01 • DORMANT',t:'Dormant',need:0},
{id:2,min:10,max:19,s:'STYLE 02 • AWAKENING',t:'Awakening',need:1000},
{id:3,min:20,max:29,s:'STYLE 03 • RADIANT',t:'Radiant',need:3000},
{id:4,min:30,max:39,s:'STYLE 04 • LUMINOUS',t:'Luminous',need:6000},
{id:5,min:40,max:49,s:'STYLE 05 • ETHEREAL',t:'Ethereal',need:10000},
{id:6,min:50,max:59,s:'STYLE 06 • AURA',t:'Aura',need:20000},
{id:7,min:60,max:69,s:'STYLE 07 • CELESTIAL',t:'Celestial',need:40000},
{id:8,min:70,max:79,s:'STYLE 08 • DIVINE',t:'Divine',need:80000},
{id:9,min:80,max:89,s:'STYLE 09 • LEGENDARY',t:'Legendary',need:150000},
{id:10,min:90,max:999,s:'STYLE 10 • MYTHIC',t:'Mythic',need:200000}
];
let TASKS=JSON.parse(localStorage.getItem('nsya_tasks')||JSON.stringify([
{id:1,title:'Morning Meditation',aura:50,desc:'10 min'},
{id:2,title:'Share Positivity',aura:100,desc:'Post aura'},
{id:3,title:'Complete Profile Photo',aura:200,desc:'Add real photo'},
{id:4,title:'Invite Friend',aura:300,desc:'Grow circle'},
{id:5,title:'Daily Check-in',aura:75,desc:'Open daily'}
]));
function getLvl(a){let c=LEVELS[0];for(let l of LEVELS){if(a>=l.need)c=l}return c}
function save(){localStorage.setItem('nsya_users',JSON.stringify(USERS));localStorage.setItem('nsya_admin',JSON.stringify(ADMIN));localStorage.setItem('nsya_tasks',JSON.stringify(TASKS));if(CUR)localStorage.setItem('nsya_cur',JSON.stringify(CUR));render()}
let page='home',tab='user';
function render(){
let app=document.getElementById('app');
if(!CUR){
app.innerHTML=`<div class="min-h-screen flex items-center justify-center p-4 bg-[radial-gradient(circle_at_top,#3a2a00,black_70%)]"><div class="w-full max-w-md glass rounded-[2.5rem] p-8"><h1 class="text-3xl font-black text-center leading-none">NOW SHINE<br><span class="text-yellow-400">YOUR AURA</span></h1><p class="text-center text-[10px] tracking-[0.4em] opacity-50 mt-2">AURA PROCESS • ANUP 999+ • OFFICIAL</p><div class="flex gap-2 mt-6 p-1 rounded-full bg-white/10"><button onclick="tab='user';render()" class="flex-1 py-2.5 rounded-full ${tab=='user'?'bg-white text-black font-bold':''} text-sm">User Login</button><button onclick="tab='admin';render()" class="flex-1 py-2.5 rounded-full ${tab=='admin'?'bg-white text-black font-bold':''} text-sm">Admin Login</button></div><input id="n" placeholder="Full Name" class="w-full mt-4 p-4 rounded-2xl bg-white/10 outline-none border border-white/10 ${tab=='admin'?'hidden':''}"><input id="e" placeholder="Email" class="w-full mt-3 p-4 rounded-2xl bg-white/10 outline-none border border-white/10"><input id="p" type="password" placeholder="Password" class="w-full mt-3 p-4 rounded-2xl bg-white/10 outline-none border border-white/10"><input id="ph" type="file" accept="image/*" class="w-full mt-3 text-xs opacity-60 ${tab=='admin'?'hidden':''}"><button onclick="login()" class="w-full mt-5 py-4 rounded-2xl bg-gradient-to-r from-yellow-300 to-amber-500 text-black font-black text-lg">ENTER AURA →</button></div></div>`;return
}
let lvl=getLvl(CUR.aura||0);
let isAdmin=CUR.role=='admin';
if(isAdmin){
app.innerHTML=`<div class="p-4 max-w-6xl mx-auto"><div class="glass rounded-[2rem] p-6 flex justify-between items-center"><h2 class="text-2xl font-black">ADMIN DASHBOARD 👑 <span class="text-yellow-400 text-sm">ANUP 999+</span></h2><button onclick="logout()" class="px-5 py-2 rounded-full bg-red-500/20 text-red-400">Logout</button></div><div class="grid grid-cols-3 gap-4 mt-6"><div class="glass rounded-2xl p-5 text-center"><h3 class="text-3xl font-black">${USERS.length}</h3><p class="text-xs opacity-60">Total Users</p></div><div class="glass rounded-2xl p-5 text-center"><h3 class="text-3xl font-black text-yellow-400">${USERS.reduce((s,u)=>s+(u.aura||0),0)}</h3><p class="text-xs opacity-60">Total Aura</p></div><div class="glass rounded-2xl p-5 text-center"><h3 class="text-3xl font-black">${TASKS.length}</h3><p class="text-xs opacity-60">Tasks</p></div></div><div class="grid md:grid-cols-2 gap-6 mt-6"><div class="glass rounded-2xl p-5"><h3 class="font-bold mb-3">Give Aura</h3><input id="giveEmail" placeholder="User Email" class="w-full p-3 rounded-xl bg-white/10 border border-white/10"><input id="giveAura" type="number" placeholder="Aura Amount" class="w-full p-3 mt-2 rounded-xl bg-white/10 border border-white/10"><button onclick="giveAura()" class="w-full mt-3 py-3 rounded-xl bg-yellow-400 text-black font-black">Give Aura</button></div><div class="glass rounded-2xl p-5"><h3 class="font-bold mb-3">Create Task</h3><input id="tTitle" placeholder="Task Title" class="w-full p-3 rounded-xl bg-white/10 border border-white/10"><input id="tAura" type="number" placeholder="Aura Reward" class="w-full p-3 mt-2 rounded-xl bg-white/10 border border-white/10"><button onclick="addTask()" class="w-full mt-3 py-3 rounded-xl bg-white text-black font-black">Add Task</button></div></div><div class="mt-6 glass rounded-2xl p-5"><h3 class="font-bold">All Users</h3><div class="mt-3 space-y-2">${USERS.map(u=>`<div class="flex justify-between items-center p-3 rounded-xl bg-white/5"><div><p class="font-bold">${u.name} ${u.banned?'<span class=text-red-400>[BANNED]</span>':''}</p><p class="text-xs opacity-60">${u.email} • ${u.aura} AE • ${getLvl(u.aura).t}</p></div><div class="flex gap-2"><button onclick="banUser(${u.id})" class="px-3 py-1 rounded-full text-xs bg-red-500/20 text-red-400">${u.banned?'Unban':'Ban'}</button><button onclick="delUser(${u.id})" class="px-3 py-1 rounded-full text-xs bg-white/10">Del</button></div></div>`).join('')}</div></div></div>`;
}else{
app.innerHTML=`<div class="p-4 max-w-5xl mx-auto"><div class="glass rounded-[1.8rem] p-4 flex justify-between items-center"><h2 class="font-black text-lg">NSYA • ${CUR.name}</h2><div class="flex gap-2"><button onclick="page='home';render()" class="px-4 py-2 rounded-full ${page=='home'?'bg-white text-black': 'bg-white/10'} text-xs font-bold">Home</button><button onclick="page='aura';render()" class="px-4 py-2 rounded-full ${page=='aura'?'bg-white text-black': 'bg-white/10'} text-xs font-bold">Aura</button><button onclick="page='profile';render()" class="px-4 py-2 rounded-full ${page=='profile'?'bg-white text-black': 'bg-white/10'} text-xs font-bold">Profile</button><button onclick="page='settings';render()" class="px-4 py-2 rounded-full bg-white/10 text-xs"><i class="fa-solid fa-gear"></i></button></div></div>
${page=='home'?`<div class="mt-6 grid md:grid-cols-2 gap-6"><div class="glass rounded-[2rem] p-8"><h1 class="text-5xl font-black leading-none">${CUR.aura||0}<span class="text-yellow-400 text-2xl"> AE</span></h1><p class="mt-2 opacity-70">${lvl.s}</p><div class="mt-4 w-full h-3 rounded-full bg-white/10 overflow-hidden"><div class="h-full bg-gradient-to-r from-yellow-300 to-amber-500" style="width:${Math.min(100,((CUR.aura-lvl.need)/( (LEVELS[LEVELS.findIndex(x=>x.id==lvl.id)+1]?.need||lvl.need+1)-lvl.need))*100)}%"></div></div><p class="text-xs mt-2 opacity-60">Level ${lvl.min}+ • Next: ${LEVELS[LEVELS.findIndex(x=>x.id==lvl.id)+1]?.need||'MAX'} AE</p></div><div class="space-y-3">${TASKS.map(t=>`<div class="glass rounded-2xl p-4 flex justify-between items-center"><div><p class="font-bold text-sm">${t.title}</p><p class="text-xs opacity-60">${t.desc} • +${t.aura} AE</p></div><button onclick="doTask(${t.id})" class="px-4 py-2 rounded-full bg-yellow-400 text-black text-xs font-black">Do</button></div>`).join('')}</div></div>`:''}
${page=='aura'?`<div class="mt-6 glass rounded-[1.8rem] p-8 text-center"><h1 class="text-[64px] font-black text-yellow-400 leading-none">${CUR.aura||0}</h1><p class="opacity-70 mt-2">Aura Energy • Level ${lvl.min}+ ${lvl.t}</p><p class="text-xs mt-2 opacity-60">${lvl.s}</p></div>`:''}
${page=='profile'?`<div class="mt-6 glass rounded-[1.8rem] p-6 flex gap-5 items-center"><img src="${CUR.photo||'https://i.pravatar.cc/150'}" class="w-24 h-24 rounded-[1.5rem] object-cover border-2 border-yellow-400"><div><h3 class="text-2xl font-black">${CUR.name}</h3><p class="opacity-60 text-sm">${CUR.email} • ${CUR.aura} AE • Level ${lvl.min}+</p><input type="file" id="newPhoto" accept="image/*" class="mt-3 text-xs"></div></div><div class="mt-4 gold rounded-[1.8rem] p-6"><h3 class="font-black text-yellow-400">ANUP 999+ REFERENCE CARD</h3><p class="text-sm mt-2">Name: ANUP • Level: 999+ • Aura: Eternal Origin • Type: Mythic • Energy: Not Defined • Vibe: Aura God<br>Code: 0000 0000 9999 0001 • STYLE 10 • MYTHIC • ADMIN SPECIAL<br><i>"Beyond levels, I AM aura."</i></p></div>`:''}
${page=='settings'?`<div class="mt-6 glass rounded-2xl p-5 space-y-3"><h3 class="font-bold">Settings</h3><input id="setName" value="${CUR.name}" class="w-full p-4 rounded-xl bg-white/10 border border-white/10"><input id="setEmail" value="${CUR.email}" class="w-full p-4 rounded-xl bg-white/10 border border-white/10"><button onclick="CUR.name=document.getElementById('setName').value;CUR.email=document.getElementById('setEmail').value;let i=USERS.findIndex(x=>x.id==CUR.id);if(i>=0){USERS[i].name=CUR.name;USERS[i].email=CUR.email}save();alert('Saved')" class="w-full py-3.5 rounded-xl bg-yellow-400 text-black font-black">Save</button><button onclick="logout()" class="w-full py-3 rounded-xl bg-red-500/20 text-red-400">Logout</button></div>`:''}
</div></div>`;
let np=document.getElementById('newPhoto');if(np)np.onchange=e=>{let f=e.target.files[0];let r=new FileReader();r.onload=ev=>{CUR.photo=ev.target.result;let idx=USERS.findIndex(x=>x.id==CUR.id);if(idx>=0)USERS[idx].photo=CUR.photo;save()};r.readAsDataURL(f)};
}
}
function giveAura(){let em=document.getElementById('giveEmail').value.trim();let am=parseInt(document.getElementById('giveAura').value);let u=USERS.find(x=>x.email==em);if(!u)return alert('User not found');u.aura=(u.aura||0)+am;save();alert('Aura Given')}
function addTask(){let t=document.getElementById('tTitle').value;let a=parseInt(document.getElementById('tAura').value);if(!t||!a)return;TASKS.push({id:Date.now(),title:t,aura:a,desc:'Custom'});save()}
function doTask(id){let t=TASKS.find(x=>x.id==id);if(!t)return;CUR.aura=(CUR.aura||0)+t.aura;let idx=USERS.findIndex(x=>x.id==CUR.id);if(idx>=0)USERS[idx].aura=CUR.aura;save();alert('+' + t.aura + ' Aura Added')}
function banUser(id){let u=USERS.find(x=>x.id==id);if(u){u.banned=!u.banned;save()}}
function delUser(id){if(confirm('Delete?')){USERS=USERS.filter(x=>x.id!=id);save()}}
function login(){
let n=document.getElementById('n')?.value||'',e=document.getElementById('e').value.trim(),p=document.getElementById('p').value.trim();
if(tab=='admin'){if(e==ADMIN.email&&p==ADMIN.pass){CUR={role:'admin',...ADMIN};save()}else alert('Wrong Admin! anup97005@admin.com / facedevilff1225');return}
let f=document.getElementById('ph')?.files[0];
let go=(ph='')=>{let u=USERS.find(x=>x.email==e);if(u){if(u.banned){alert('BANNED');return}if(u.pass!=p){alert('Wrong password');return}CUR={role:'user',...u};save()}else{if(!n||!e||!p){alert('Fill Name Email Pass');return}let nu={id:Date.now(),name:n,email:e,pass:p,aura:0,photo:ph,banned:false};USERS.push(nu);CUR={role:'user',...nu};save()}};
if(f){let r=new FileReader();r.onload=ev=>go(ev.target.result);r.readAsDataURL(f)}else go('');
}
function logout(){CUR=null;localStorage.removeItem('nsya_cur');render()}
render();
</script>
<div id="app"></div>
</body>
</html>
